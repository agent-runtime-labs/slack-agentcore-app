# The Strands agent container — same image as AgentCore Runtime, "localdev" target.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slack-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: slack-agent
  template:
    metadata:
      labels:
        app: slack-agent
    spec:
      containers:
        - name: slack-agent
          image: slack-agent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: aws-credentials
          env:
            # Posts progress and downloads the files people attach (slack_api.py). Only
            # the bot token: the agent has no use for the signing secret.
            - name: SLACK_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: slack-credentials
                  key: SLACK_BOT_TOKEN
                  optional: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "768Mi"
              cpu: "1"
          readinessProbe:
            httpGet:
              path: /ping
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: slack-agent
spec:
  type: ClusterIP
  selector:
    app: slack-agent
  ports:
    - port: 8080
      targetPort: 8080

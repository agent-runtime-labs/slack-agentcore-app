# The three Lambda handlers behind a local FastAPI server (stands in for API Gateway + SQS).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slack-app
spec:
  # Must stay at 1: the local queue and pending-OAuth store are in-process.
  replicas: 1
  selector:
    matchLabels:
      app: slack-app
  template:
    metadata:
      labels:
        app: slack-app
    spec:
      containers:
        - name: slack-app
          image: slack-app
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: app-config
            - secretRef:
                name: aws-credentials
            - secretRef:
                name: slack-credentials
          env:
            - name: AGENT_LOCAL_URL
              value: http://slack-agent:8080
          resources:
            requests:
              memory: "128Mi"
              cpu: "50m"
            limits:
              memory: "384Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: slack-app
spec:
  type: ClusterIP
  selector:
    app: slack-app
  ports:
    - port: 8081
      targetPort: 8081
